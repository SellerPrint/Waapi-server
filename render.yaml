services:
  - type: web
    name: waapi-server
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/index.js
    plan: free

    envVars:
      - key: WAHA_API_KEY
        value: supercleapi

      - key: WAHA_DASHBOARD_ENABLED
        value: "false"

      - key: WAHA_SWAGGER_ENABLED
        value: "false"

      - key: BASIC_AUTH_ENABLED
        value: "false"

      - key: AUTHENTICATION_ENABLED
        value: "false"
